<template>
    <div class="dashboard">
        <aside class="navigation-drawer" aria-label="RESCUE navigation">
                <div class="drawer-header">
                    <div>
                        <span class="drawer-kicker">RESCUE</span>
                        <h2>Operations menu</h2>
                    </div>
                </div>
                <nav class="drawer-nav">
                    <p class="drawer-section-label">Operations</p>
                    <template for:each={navigationItems} for:item="item">
                        <button key={item.key} class={item.className} type="button" data-navigation={item.key} onclick={handleNavigationSelect}>
                            <lightning-icon icon-name={item.icon} alternative-text="" size="x-small"></lightning-icon>
                            <span>{item.label}</span>
                            <template if:true={item.key}>
                                <lightning-icon icon-name="utility:chevronright" alternative-text="" size="xx-small"></lightning-icon>
                            </template>
                        </button>
                    </template>
                </nav>
                <div class="drawer-status"><span></span><div><strong>System online</strong><small>All services operational</small></div></div>
                <div class="drawer-footer"><span class="drawer-avatar">RP</span><div><strong>Response lead</strong><small>Emergency operations</small></div></div>
        </aside>

        <div class="page-header">
            <div>
                <p class="eyebrow">Emergency Operations</p>
                <h1 class="title">Disaster Response Command Center</h1>
                <p class="subtitle">AI-powered insights. Faster decisions. Safer communities.</p>
            </div>
            <div class="tagline">"Detect. Assess. Respond. Recover."</div>
        </div>

        <template if:true={errorMessage}>
            <div class="error-banner">{errorMessage}</div>
        </template>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Working" size="small"></lightning-spinner>
        </template>

        <div class="metrics-row">
            <div class="metric-card">
                <p class="metric-label">Active Incidents</p>
                <p class="metric-value">{metrics.activeIncidents}</p>
            </div>
            <div class="metric-card">
                <p class="metric-label">Available Resources</p>
                <p class="metric-value">{metrics.availableResourceQuantity}</p>
            </div>
            <div class="metric-card">
                <p class="metric-label">Avg Response Time</p>
                <p class="metric-value">{metrics.avgEtaHours} hours</p>
            </div>
            <div class="metric-card">
                <p class="metric-label">Locations Monitored</p>
                <p class="metric-value">{metrics.locationsMonitored}</p>
            </div>
        </div>

        <div class={mainGridClass}>
            <template if:true={showIncidentsView}>
            <div class="card recent-incidents">
                <h2 class="card-title">Recent Incidents</h2>
                <template if:false={hasIncidents}>
                    <p class="empty-state">No incidents yet.</p>
                </template>
                <template for:each={recentIncidents} for:item="incident">
                    <div key={incident.id} class={incident.rowClass} data-id={incident.id} onclick={handleSelectIncident}>
                        <div>
                            <p class="incident-name">{incident.name}</p>
                            <p class="incident-location">{incident.location}</p>
                        </div>
                        <div class="incident-meta">
                            <span class={incident.severityClass}>{incident.severity}</span>
                            <span class="incident-time">{incident.timeLabel}</span>
                        </div>
                    </div>
                </template>
            </div>
            </template>

            <div class="card map-card">
                <div class="map-card-header">
                    <h2 class="card-title">Incident & Resource Center Map</h2>
                    <lightning-button label={toggleMapLabel} onclick={handleToggleGlobe}></lightning-button>
                </div>
                <div class="map-legend" role="group" aria-label="Map legend">
                    <div class="legend-item">
                        <span class="legend-icon legend-icon-incident"></span>
                        <span>Incident</span>
                    </div>
                    <button class="legend-item" type="button" onclick={handleShowWarehouses} aria-pressed={showWarehouses}>
                        <span class="legend-icon legend-icon-warehouse"></span>
                        <span>{warehouseLegendLabel}</span>
                    </button>
                    <div class="legend-item">
                        <span class="legend-icon legend-icon-route"></span>
                        <span>Response route</span>
                    </div>
                </div>
                <template if:true={showGlobe}>
                    <div class="globe-wrap">
                        <div class="globe-canvas-wrap"></div>

                        <template if:true={globeLoadError}>
                            <p class="globe-error">{globeLoadError}</p>
                        </template>

                        <div class="globe-zoom-controls">
                            <lightning-button-icon
                                icon-name="utility:zoomin"
                                variant="border-filled"
                                alternative-text="Zoom in"
                                onclick={handleGlobeZoomIn}
                            ></lightning-button-icon>
                            <lightning-button-icon
                                icon-name="utility:zoomout"
                                variant="border-filled"
                                alternative-text="Zoom out"
                                onclick={handleGlobeZoomOut}
                            ></lightning-button-icon>
                        </div>

                        <template if:true={hasGlobeDetail}>
                            <div class="globe-detail-card">
                                <p class="globe-detail-name">{globeDetailName}</p>
                                <p class="globe-detail-subtitle">{globeDetailSubtitle}</p>
                                <div class="globe-detail-facts">
                                    <span class="globe-detail-severity">{globeDetailPrimaryFact}</span>
                                    <span>{globeDetailSecondaryFact}</span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
                <template if:false={showGlobe}>
                    <template if:true={hasMapMarkers}>
                        <lightning-map
                            class="map-frame"
                            map-markers={mapMarkers}
                            selected-marker-value={selectedMarkerValue}
                            center={mapCenter}
                            zoom-level={mapZoomLevel}
                            list-view="hidden"
                            onmarkerselect={handleMapMarkerSelect}
                        ></lightning-map>
                    </template>
                    <template if:false={hasMapMarkers}>
                        <p class="empty-state">No geocoded incidents to plot yet.</p>
                    </template>
                </template>
            </div>

            <div class="card agent-panel">
                <div class="agent-header">
                    <span class="agent-logo"><lightning-icon icon-name="utility:einstein" alternative-text="AI Agent" size="small"></lightning-icon></span>
                    <div class="agent-heading-copy">
                        <div class="agent-title-row"><span class="agent-title">AI Agent</span><span class="agent-badge">Agentforce</span></div>
                        <span class="agent-status"><span></span>Online</span>
                    </div>
                </div>
                <p class="agent-subtitle">AI Incident Response Agent</p>

                <template if:true={hasTopIncident}>
                    <div class="incident-card">
                        <p class="incident-card-title">{topIncident.Name}</p>
                        <p class="incident-card-subtitle">{topIncidentSubtitle}</p>
                        <lightning-button
                            variant="base"
                            label={incidentDetailsToggleLabel}
                            class="incident-details-toggle"
                            onclick={handleIncidentDetailsToggle}
                        ></lightning-button>
                        <template if:true={incidentDetailsExpanded}>
                            <dl class="incident-facts">
                                <dt>Severity</dt>
                                <dd>{topIncident.Severity__c}</dd>
                                <dt>Status</dt>
                                <dd>{topIncident.Status__c}</dd>
                                <dt>Estimated Impact</dt>
                                <dd>~ {topIncident.Population_Affected__c} people affected</dd>
                            </dl>

                            <p class="next-steps-title">Recommended Next Steps</p>
                            <template for:each={nextSteps} for:item="step">
                                <div key={step.key} class="next-step">
                                    <span class={step.numberClass}>{step.number}</span>
                                    <span>{step.label}</span>
                                </div>
                            </template>

                            <lightning-button
                                variant="brand"
                                label="Approve & Dispatch"
                                class="view-plan-btn"
                                disabled={approveDisabled}
                                onclick={handleApprove}
                            ></lightning-button>
                        </template>
                    </div>

                    <div class="agent-chat">
                        <template for:each={chatMessages} for:item="message">
                            <div key={message.id} class={message.from}>{message.text}</div>
                        </template>
                    </div>

                    <template if:true={agentLoading}>
                        <div class="agent-loading" role="status">
                            <span class="agent-loading-dot"></span>
                            <span>RESCUE is processing this incident...</span>
                        </div>
                    </template>

                    <div class="agent-ask">
                        <lightning-input
                            label="Ask"
                            variant="label-hidden"
                            placeholder="Ask me anything about this incident..."
                            value={askText}
                            onchange={handleAskChange}
                            onkeydown={handleAskKeydown}
                            disabled={agentLoading}
                        ></lightning-input>
                        <lightning-button-icon icon-name="utility:send" onclick={handleAsk} disabled={agentLoading}></lightning-button-icon>
                    </div>
                    <p class="agent-disclaimer">AI may make mistakes. Please review critical information.</p>
                </template>
            </div>

            <template if:true={showResourceCentersView}>
            <div class="card resource-center-card">
                <template if:true={hasNearestResourceCenter}>
                    <div class="resource-center-header">
                        <span class="resource-center-icon"><lightning-icon icon-name="utility:location" alternative-text="Resource center" size="small"></lightning-icon></span>
                        <div>
                            <h2 class="card-title">Nearest Resource Center</h2>
                            <p class="resource-center-name">{nearestResourceCenter.name}</p>
                            <p class="resource-center-location"><lightning-icon icon-name="utility:location" alternative-text="Location" size="xx-small"></lightning-icon>{nearestResourceCenter.location}</p>
                        </div>
                    </div>
                    <div class="resource-grid">
                        <template for:each={nearestResourceCenter.breakdown} for:item="item">
                            <div key={item.id} class="resource-item">
                                <div class="resource-item-header">
                                    <span class={item.iconClass}><lightning-icon icon-name={item.iconName} alternative-text={item.type} size="small"></lightning-icon></span>
                                    <lightning-icon icon-name="utility:chevronright" alternative-text="View resource" size="x-small"></lightning-icon>
                                </div>
                                <p class="resource-qty">{item.quantityLabel}</p>
                                <p class="resource-type">{item.type}</p>
                                <p class="resource-available"><strong>{item.availableToAllocateLabel}</strong> available to allocate</p>
                                <div class="resource-progress-track" role="progressbar" aria-label="Available to allocate" aria-valuemin="0" aria-valuemax="100" aria-valuenow={item.availabilityPercent}>
                                    <span class="resource-progress-fill" style={item.progressStyle}></span>
                                </div>
                                <div class="resource-progress-labels"><span>{item.availabilityPercent}% available</span><span>{item.availableToAllocateLabel} / {item.quantityLabel}</span></div>
                            </div>
                        </template>
                    </div>
                </template>
                <template if:false={hasNearestResourceCenter}>
                    <p class="empty-state">No resource centers seeded yet.</p>
                </template>
            </div>
            </template>

            <template if:true={hasAllocationProposal}>
            <template if:true={showAllocationView}>
            <div class="card allocation-card">
                <div class="allocation-header">
                    <span class="allocation-icon"><lightning-icon icon-name="utility:magicwand" alternative-text="AI recommendation" size="small"></lightning-icon></span>
                    <h2 class="card-title">AI Recommended Allocation</h2>
                </div>
                <template if:true={hasAllocationBreakdown}>
                    <template for:each={allocationBreakdown} for:item="item">
                        <div key={item.id} class="allocation-row">
                            <div class="allocation-main">
                                <span class="allocation-type">{item.type}</span>
                                <span class="allocation-resource">{item.resourceName}</span>
                                <span class="allocation-source">From {item.warehouseName}<template if:true={item.warehouseLocation}> · {item.warehouseLocation}</template></span>
                            </div>
                            <div class="allocation-meta">
                                <span class="allocation-qty">{item.allocatedQty} of {item.requestedQty}</span>
                                <span class="allocation-status">{item.status}</span>
                            </div>
                        </div>
                    </template>
                </template>
                <template if:false={hasAllocationBreakdown}>
                    <p class="empty-state">No allocation recommendation yet.</p>
                </template>
                <template if:true={isModifyMode}>
                    <div class="modify-panel">
                        <div class="modify-panel-heading">Adjust this proposal</div>
                        <p class="modify-panel-help">Describe the change. RESCUE will recalculate quantities, sources, coverage, risk, and ETA.</p>
                        <lightning-textarea
                            label="Modification instructions"
                            value={modificationText}
                            onchange={handleModificationChange}
                            placeholder="Example: Prioritize medical supplies, use the nearest warehouse, and keep water allocation unchanged."
                        ></lightning-textarea>
                        <div class="modify-actions">
                            <lightning-button label="Cancel" onclick={handleCancelModification}></lightning-button>
                            <lightning-button variant="brand" label="Modify" onclick={handleSubmitModification} disabled={agentLoading}></lightning-button>
                        </div>
                    </div>
                </template>
                <div class="allocation-actions">
                    <lightning-button label="Modify Plan" onclick={handleModifyPlan} disabled={isModifyMode}></lightning-button>
                    <lightning-button variant="brand" label="Approve & Dispatch" disabled={approveDisabled} onclick={handleApprove}></lightning-button>
                </div>
            </div>
            </template>
            </template>

            <template if:true={showShipmentsView}>
            <div class="card shipment-card">
                <h2 class="card-title">Shipments</h2>
                <template if:true={hasShipments}>
                    <template for:each={shipments} for:item="shipment">
                        <div key={shipment.Id} class="shipment-row">
                            <div class="shipment-main">
                                <span class="shipment-name">{shipment.Name}</span>
                                <span class="shipment-route">{shipment.Origin__c} to {shipment.Destination__c}</span>
                                <span class="shipment-carrier">{shipment.Carrier__c}</span>
                            </div>
                            <div class="shipment-meta">
                                <span class="shipment-status">{shipment.Status__c}</span>
                                <span class="shipment-eta">ETA {shipment.etaLabel}</span>
                            </div>
                        </div>
                    </template>
                </template>
                <template if:false={hasShipments}>
                    <p class="empty-state">No shipments created for this response plan.</p>
                </template>
            </div>
            </template>
        </div>
    </div>
</template>
